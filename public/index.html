<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Calendar Dashboard</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #0f1117;
      --surface: #1a1d27;
      --surface2: #242836;
      --border: #2e3348;
      --text: #e4e6f0;
      --text2: #8b8fa8;
      --accent: #6c5ce7;
      --accent2: #a29bfe;
      --green: #00b894;
      --red: #e17055;
      --orange: #fdcb6e;
      --blue: #74b9ff;
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: 'Inter', sans-serif; background: var(--bg); color: var(--text); min-height: 100vh; }

    /* Header */
    .header { display: flex; justify-content: space-between; align-items: center; padding: 16px 28px; border-bottom: 1px solid var(--border); background: var(--surface); }
    .logo { font-size: 20px; font-weight: 700; }
    .logo-dot { color: var(--accent2); }
    .header-actions { display: flex; gap: 10px; }
    .btn { padding: 9px 18px; border-radius: 8px; border: none; font-size: 13px; font-weight: 600; cursor: pointer; font-family: inherit; transition: .2s; }
    .btn:hover { opacity: .85; }
    .btn-primary { background: var(--accent); color: #fff; }
    .btn-outline { background: transparent; border: 1px solid var(--border); color: var(--text2); }
    .btn-outline:hover { border-color: var(--accent); color: var(--text); }
    .btn-success { background: var(--green); color: #fff; }
    .btn-danger { background: var(--red); color: #fff; }
    .btn-sm { padding: 6px 12px; font-size: 12px; }

    /* Tabs */
    .tabs { display: flex; gap: 2px; padding: 12px 28px 0; background: var(--surface); }
    .tab { padding: 10px 20px; border-radius: 8px 8px 0 0; cursor: pointer; font-size: 13px; font-weight: 500; color: var(--text2); background: transparent; border: none; font-family: inherit; transition: .2s; }
    .tab.active { background: var(--bg); color: var(--text); }
    .tab:hover { color: var(--text); }
    .badge { background: var(--orange); color: #000; font-size: 10px; padding: 2px 7px; border-radius: 10px; margin-left: 6px; font-weight: 700; }

    /* Layout */
    .main { display: flex; height: calc(100vh - 110px); }
    .sidebar { width: 300px; border-right: 1px solid var(--border); padding: 20px; overflow-y: auto; background: var(--surface); flex-shrink: 0; }
    .content { flex: 1; overflow-y: auto; padding: 24px 28px; }

    /* Mini Calendar */
    .cal-nav { display: flex; justify-content: space-between; align-items: center; margin-bottom: 14px; }
    .cal-nav button { background: none; border: none; color: var(--text2); cursor: pointer; font-size: 18px; padding: 4px 10px; border-radius: 6px; }
    .cal-nav button:hover { background: var(--surface2); color: var(--text); }
    .cal-month { font-size: 15px; font-weight: 600; }
    .cal-grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 2px; text-align: center; }
    .cal-label { font-size: 10px; color: var(--text2); padding: 6px 0; font-weight: 600; text-transform: uppercase; }
    .cal-day { padding: 7px 0; font-size: 13px; border-radius: 6px; cursor: pointer; transition: .15s; color: var(--text2); }
    .cal-day:hover { background: var(--surface2); }
    .cal-day.today { background: var(--accent); color: #fff; font-weight: 700; }
    .cal-day.selected { outline: 2px solid var(--accent2); }
    .cal-day.other { opacity: .25; pointer-events: none; }
    .cal-day.has-event::after { content: ''; display: block; width: 4px; height: 4px; background: var(--green); border-radius: 50%; margin: 2px auto 0; }

    /* Section */
    .section-title { font-size: 11px; font-weight: 700; text-transform: uppercase; letter-spacing: 1px; color: var(--text2); margin: 24px 0 10px; }

    /* Event Card */
    .event-card { background: var(--surface2); border-radius: 10px; padding: 12px 14px; margin-bottom: 8px; border-left: 3px solid var(--accent); cursor: pointer; transition: .2s; }
    .event-card:hover { transform: translateX(3px); }
    .event-time { font-size: 11px; color: var(--accent2); font-weight: 600; }
    .event-title { font-size: 14px; font-weight: 500; margin-top: 3px; }
    .event-meta { font-size: 12px; color: var(--text2); margin-top: 4px; }
    .event-link { display: inline-flex; align-items: center; gap: 4px; font-size: 11px; color: var(--blue); background: rgba(116,185,255,.1); padding: 2px 8px; border-radius: 4px; margin-top: 4px; text-decoration: none; }
    .event-link:hover { background: rgba(116,185,255,.2); }
    .event-desc { font-size: 12px; color: var(--text2); margin-top: 6px; padding-top: 6px; border-top: 1px solid var(--border); line-height: 1.4; }

    /* Request Card */
    .req-card { background: var(--surface2); border-radius: 10px; padding: 14px; margin-bottom: 10px; border-left: 3px solid var(--orange); }
    .req-card.approved { border-left-color: var(--green); }
    .req-card.declined { border-left-color: var(--red); opacity: .6; }
    .req-header { display: flex; justify-content: space-between; align-items: center; }
    .req-name { font-weight: 600; font-size: 14px; }
    .req-badge { font-size: 10px; padding: 3px 8px; border-radius: 20px; font-weight: 700; text-transform: uppercase; }
    .badge-pending { background: rgba(253,203,110,.15); color: var(--orange); }
    .badge-approved { background: rgba(0,184,148,.15); color: var(--green); }
    .badge-declined { background: rgba(225,112,85,.15); color: var(--red); }
    .req-details { font-size: 13px; color: var(--text2); margin-top: 8px; line-height: 1.6; }
    .req-actions { display: flex; gap: 8px; margin-top: 12px; }

    /* Timeline */
    .timeline-row { display: flex; min-height: 50px; border-bottom: 1px solid var(--border); }
    .timeline-hour { width: 60px; font-size: 11px; color: var(--text2); padding: 4px 8px; flex-shrink: 0; font-weight: 500; }
    .timeline-content { flex: 1; padding: 4px 8px; }
    .day-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; }
    .day-title { font-size: 18px; font-weight: 600; }

    /* Availability */
    .avail-row { display: flex; align-items: center; gap: 14px; padding: 12px 0; border-bottom: 1px solid var(--border); }
    .avail-day { width: 100px; font-size: 14px; font-weight: 500; }
    .toggle { position: relative; width: 44px; height: 24px; flex-shrink: 0; }
    .toggle input { display: none; }
    .toggle .slider { position: absolute; inset: 0; background: var(--border); border-radius: 12px; cursor: pointer; transition: .2s; }
    .toggle .slider::before { content: ''; position: absolute; width: 18px; height: 18px; left: 3px; top: 3px; background: #fff; border-radius: 50%; transition: .2s; }
    .toggle input:checked + .slider { background: var(--green); }
    .toggle input:checked + .slider::before { transform: translateX(20px); }
    .avail-times { display: flex; gap: 8px; align-items: center; font-size: 13px; color: var(--text2); }
    .avail-times input { width: 90px; padding: 6px 10px; background: var(--surface2); border: 1px solid var(--border); border-radius: 6px; color: var(--text); font-size: 13px; font-family: inherit; }

    /* Modal */
    .modal-bg { display: none; position: fixed; inset: 0; background: rgba(0,0,0,.6); z-index: 100; align-items: center; justify-content: center; }
    .modal-bg.open { display: flex; }
    .modal { background: var(--surface); border: 1px solid var(--border); border-radius: 16px; padding: 28px; width: 500px; max-width: 95vw; max-height: 90vh; overflow-y: auto; }
    .modal h2 { font-size: 18px; font-weight: 600; margin-bottom: 20px; }
    .field { margin-bottom: 16px; }
    .field label { display: block; font-size: 12px; font-weight: 600; color: var(--text2); margin-bottom: 6px; text-transform: uppercase; letter-spacing: .5px; }
    .field input, .field textarea, .field select { width: 100%; padding: 10px 14px; background: var(--surface2); border: 1px solid var(--border); border-radius: 8px; color: var(--text); font-size: 14px; font-family: inherit; }
    .field input:focus, .field textarea:focus { outline: none; border-color: var(--accent); }
    .field-row { display: flex; gap: 12px; }
    .field-row .field { flex: 1; }
    .modal-footer { display: flex; gap: 10px; justify-content: flex-end; margin-top: 24px; }
    .btn-cancel { background: var(--surface2); color: var(--text2); }

    /* Toast */
    .toast { position: fixed; bottom: 24px; right: 24px; background: var(--surface); border: 1px solid var(--border); border-radius: 10px; padding: 14px 20px; font-size: 14px; z-index: 200; transform: translateY(100px); opacity: 0; transition: .3s; }
    .toast.show { transform: translateY(0); opacity: 1; }
    .toast.ok { border-left: 3px solid var(--green); }
    .toast.err { border-left: 3px solid var(--red); }

    /* Panel */
    .panel { display: none; }
    .panel.active { display: block; }

    /* Empty */
    .empty { text-align: center; padding: 40px 20px; color: var(--text2); }
    .empty-icon { font-size: 36px; margin-bottom: 10px; }
    .empty p { font-size: 14px; }

    /* Responsive */
    @media (max-width: 768px) {
      .main { flex-direction: column; height: auto; }
      .sidebar { width: 100%; border-right: none; border-bottom: 1px solid var(--border); }
      .header { flex-direction: column; gap: 12px; padding: 14px; }
      .content { padding: 16px; }
    }
  </style>
</head>
<body>

  <div class="header">
    <div class="logo">Calendar<span class="logo-dot">.</span></div>
    <div class="header-actions">
      <button class="btn btn-outline" onclick="copyLink()">Copy Booking Link</button>
      <button class="btn btn-primary" onclick="openModal()">+ New Event</button>
    </div>
  </div>

  <div class="tabs">
    <button class="tab active" onclick="switchTab('calendar', this)">Calendar</button>
    <button class="tab" onclick="switchTab('requests', this)">Requests <span id="pending-count"></span></button>
    <button class="tab" onclick="switchTab('availability', this)">Availability</button>
  </div>

  <div class="main">
    <div class="sidebar">
      <div id="mini-cal"></div>
      <div class="section-title">Today</div>
      <div id="today-list"></div>
    </div>
    <div class="content">
      <div id="panel-calendar" class="panel active"><div id="day-view"></div></div>
      <div id="panel-requests" class="panel"><div id="req-list"></div></div>
      <div id="panel-availability" class="panel">
        <h2 style="margin-bottom:16px;font-size:18px">Weekly Availability</h2>
        <p style="color:var(--text2);font-size:14px;margin-bottom:20px">Set the hours you are available for booking. Others can only request appointments during these windows.</p>
        <div id="avail-grid"></div>
      </div>
    </div>
  </div>

  <!-- Event Modal -->
  <div class="modal-bg" id="modal">
    <div class="modal">
      <h2 id="modal-heading">New Event</h2>
      <input type="hidden" id="f-id">
      <div class="field">
        <label>Title</label>
        <input type="text" id="f-title" placeholder="Meeting title">
      </div>
      <div class="field-row">
        <div class="field"><label>Date</label><input type="date" id="f-date"></div>
        <div class="field"><label>Start</label><input type="time" id="f-start" value="09:00"></div>
        <div class="field"><label>End</label><input type="time" id="f-end" value="10:00"></div>
      </div>
      <div class="field">
        <label>Description</label>
        <textarea id="f-desc" rows="3" placeholder="What is this meeting about?"></textarea>
      </div>
      <div class="field-row">
        <div class="field"><label>Location</label><input type="text" id="f-loc" placeholder="Room, address, or online"></div>
        <div class="field"><label>Meeting Link</label><input type="url" id="f-link" placeholder="https://zoom.us/j/..."></div>
      </div>
      <div class="field-row">
        <div class="field">
          <label>Color</label>
          <select id="f-color">
            <option value="#4A90D9">Blue</option>
            <option value="#6c5ce7">Purple</option>
            <option value="#00b894">Green</option>
            <option value="#e17055">Red</option>
            <option value="#fdcb6e">Yellow</option>
            <option value="#fd79a8">Pink</option>
          </select>
        </div>
        <div class="field" style="display:flex;align-items:flex-end;padding-bottom:4px">
          <label style="display:flex;align-items:center;gap:8px;cursor:pointer;text-transform:none;letter-spacing:0">
            <input type="checkbox" id="f-block"> Block this time (no bookings)
          </label>
        </div>
      </div>
      <div class="modal-footer">
        <button class="btn btn-cancel" onclick="closeModal()">Cancel</button>
        <button class="btn btn-primary" onclick="saveEvent()">Save Event</button>
      </div>
    </div>
  </div>

  <div class="toast" id="toast"></div>

  <script>
    let events = [], requests = [], availability = [];
    let curDate = new Date(), selDate = new Date();
    const DAYS = ['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];
    const MONTHS = ['January','February','March','April','May','June','July','August','September','October','November','December'];
    const DAY_NAMES = ['Sunday','Monday','Tuesday','Wednesday','Thursday','Friday','Saturday'];

    document.addEventListener('DOMContentLoaded', load);

    async function load() {
      await Promise.all([loadEvents(), loadRequests(), loadAvail()]);
      renderMiniCal();
      renderToday();
      renderDayView();
    }

    async function loadEvents() { const r = await fetch('/api/events'); events = await r.json(); }
    async function loadRequests() {
      const r = await fetch('/api/requests'); requests = await r.json();
      const p = requests.filter(x => x.status === 'pending').length;
      document.getElementById('pending-count').innerHTML = p > 0 ? '<span class="badge">' + p + '</span>' : '';
    }
    async function loadAvail() { const r = await fetch('/api/availability'); availability = await r.json(); }

    // Tabs
    function switchTab(tab, el) {
      document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
      el.classList.add('active');
      document.querySelectorAll('.panel').forEach(p => p.classList.remove('active'));
      document.getElementById('panel-' + tab).classList.add('active');
      if (tab === 'requests') renderRequests();
      if (tab === 'availability') renderAvail();
      if (tab === 'calendar') renderDayView();
    }

    // Mini Calendar
    function renderMiniCal() {
      const el = document.getElementById('mini-cal');
      const y = curDate.getFullYear(), m = curDate.getMonth();
      const first = new Date(y, m, 1), last = new Date(y, m+1, 0);
      const startDay = first.getDay(), today = new Date();
      const evtDates = new Set(events.map(e => e.start_time.split('T')[0]));
      let h = '<div class="cal-nav"><button onclick="chgMonth(-1)">&#8249;</button><span class="cal-month">' + MONTHS[m] + ' ' + y + '</span><button onclick="chgMonth(1)">&#8250;</button></div>';
      h += '<div class="cal-grid">';
      DAYS.forEach(d => h += '<div class="cal-label">' + d + '</div>');
      for (let i = 0; i < startDay; i++) h += '<div class="cal-day other">' + new Date(y, m, -(startDay-1-i)).getDate() + '</div>';
      for (let d = 1; d <= last.getDate(); d++) {
        const ds = y + '-' + String(m+1).padStart(2,'0') + '-' + String(d).padStart(2,'0');
        const isToday = d === today.getDate() && m === today.getMonth() && y === today.getFullYear();
        const isSel = d === selDate.getDate() && m === selDate.getMonth() && y === selDate.getFullYear();
        let cls = 'cal-day';
        if (isToday) cls += ' today';
        if (isSel) cls += ' selected';
        if (evtDates.has(ds)) cls += ' has-event';
        h += '<div class="' + cls + '" onclick="pickDate(' + y + ',' + m + ',' + d + ')">' + d + '</div>';
      }
      const rem = (7 - (startDay + last.getDate()) % 7) % 7;
      for (let i = 1; i <= rem; i++) h += '<div class="cal-day other">' + i + '</div>';
      h += '</div>';
      el.innerHTML = h;
    }

    function chgMonth(d) { curDate.setMonth(curDate.getMonth() + d); renderMiniCal(); }
    function pickDate(y, m, d) { selDate = new Date(y, m, d); renderMiniCal(); renderDayView(); }

    // Today's events
    function renderToday() {
      const el = document.getElementById('today-list');
      const todayStr = new Date().toISOString().split('T')[0];
      const evts = events.filter(e => e.start_time.startsWith(todayStr));
      if (!evts.length) { el.innerHTML = '<div class="empty"><div class="empty-icon">&#127881;</div><p>No events today</p></div>'; return; }
      el.innerHTML = evts.map(e => eventCard(e)).join('');
    }

    // Day view
    function renderDayView() {
      const el = document.getElementById('day-view');
      const ds = selDate.getFullYear() + '-' + String(selDate.getMonth()+1).padStart(2,'0') + '-' + String(selDate.getDate()).padStart(2,'0');
      const dayEvts = events.filter(e => e.start_time.startsWith(ds));
      let h = '<div class="day-header"><span class="day-title">' + DAYS[selDate.getDay()] + ', ' + MONTHS[selDate.getMonth()] + ' ' + selDate.getDate() + ', ' + selDate.getFullYear() + '</span><button class="btn btn-primary btn-sm" onclick="openModal(\'' + ds + '\')">+ Add Event</button></div>';
      for (let hr = 6; hr <= 22; hr++) {
        const hrEvts = dayEvts.filter(e => parseInt(e.start_time.split('T')[1]) === hr);
        h += '<div class="timeline-row"><div class="timeline-hour">' + (hr > 12 ? hr-12 : hr || 12) + ':00 ' + (hr >= 12 ? 'PM' : 'AM') + '</div><div class="timeline-content">' + hrEvts.map(e => eventCard(e)).join('') + '</div></div>';
      }
      el.innerHTML = h;
    }

    function eventCard(e) {
      let h = '<div class="event-card" style="border-left-color:' + e.color + '" onclick="editEvent(' + e.id + ')">';
      h += '<div class="event-time">' + fmtTime(e.start_time) + ' - ' + fmtTime(e.end_time) + '</div>';
      h += '<div class="event-title">' + esc(e.title) + '</div>';
      if (e.location) h += '<div class="event-meta">Location: ' + esc(e.location) + '</div>';
      if (e.meeting_link) h += '<a class="event-link" href="' + esc(e.meeting_link) + '" target="_blank" onclick="event.stopPropagation()">Join Meeting</a>';
      if (e.description) h += '<div class="event-desc">' + esc(e.description) + '</div>';
      if (e.is_blocking) h += '<div class="event-meta" style="color:var(--red)">Blocked</div>';
      h += '</div>';
      return h;
    }

    // Requests
    function renderRequests() {
      const el = document.getElementById('req-list');
      if (!requests.length) { el.innerHTML = '<div class="empty"><div class="empty-icon">&#128234;</div><p>No requests yet. Share your booking link to receive appointments.</p></div>'; return; }
      el.innerHTML = requests.map(r => {
        let h = '<div class="req-card ' + r.status + '">';
        h += '<div class="req-header"><span class="req-name">' + esc(r.requester_name) + '</span><span class="req-badge badge-' + r.status + '">' + r.status + '</span></div>';
        h += '<div class="req-details">';
        h += '<strong>' + esc(r.title) + '</strong><br>';
        h += 'Date: ' + r.requested_date + ' | Time: ' + r.requested_start + ' - ' + r.requested_end + '<br>';
        h += 'Email: ' + esc(r.requester_email);
        if (r.description) h += '<br>Description: ' + esc(r.description);
        if (r.meeting_link) h += '<br>Link: <a href="' + esc(r.meeting_link) + '" target="_blank" style="color:var(--blue)">' + esc(r.meeting_link) + '</a>';
        if (r.owner_note) h += '<br>Your note: ' + esc(r.owner_note);
        h += '</div>';
        if (r.status === 'pending') {
          h += '<div class="req-actions"><button class="btn btn-success btn-sm" onclick="approveReq(' + r.id + ')">Approve</button><button class="btn btn-danger btn-sm" onclick="declineReq(' + r.id + ')">Decline</button></div>';
        }
        h += '</div>';
        return h;
      }).join('');
    }

    async function approveReq(id) {
      const note = prompt('Add a note (optional):');
      await fetch('/api/requests?action=approve&id=' + id, { method: 'POST', headers: {'Content-Type':'application/json'}, body: JSON.stringify({owner_note: note || ''}) });
      toast('Request approved', 'ok');
      await load(); renderRequests();
    }
    async function declineReq(id) {
      const note = prompt('Reason (optional):');
      await fetch('/api/requests?action=decline&id=' + id, { method: 'POST', headers: {'Content-Type':'application/json'}, body: JSON.stringify({owner_note: note || ''}) });
      toast('Request declined', 'ok');
      await load(); renderRequests();
    }

    // Availability
    function renderAvail() {
      const el = document.getElementById('avail-grid');
      el.innerHTML = availability.sort((a,b) => a.day_of_week - b.day_of_week).map(a =>
        '<div class="avail-row"><div class="avail-day">' + DAY_NAMES[a.day_of_week] + '</div>' +
        '<label class="toggle"><input type="checkbox" ' + (a.enabled ? 'checked' : '') + ' onchange="toggleDay(' + a.day_of_week + ',this.checked)"><span class="slider"></span></label>' +
        '<div class="avail-times"><input type="time" value="' + a.start_hour + '" onchange="setTime(' + a.day_of_week + ',\'start\',this.value)"> to <input type="time" value="' + a.end_hour + '" onchange="setTime(' + a.day_of_week + ',\'end\',this.value)"></div></div>'
      ).join('');
    }
    async function toggleDay(d, on) {
      const a = availability.find(x => x.day_of_week === d);
      await fetch('/api/availability?day=' + d, { method: 'PUT', headers: {'Content-Type':'application/json'}, body: JSON.stringify({start_hour:a.start_hour,end_hour:a.end_hour,enabled:on}) });
      toast(on ? 'Day enabled' : 'Day disabled', 'ok');
    }
    async function setTime(d, w, v) {
      const a = availability.find(x => x.day_of_week === d);
      const body = {start_hour:a.start_hour,end_hour:a.end_hour,enabled:a.enabled};
      if (w === 'start') body.start_hour = v; else body.end_hour = v;
      await fetch('/api/availability?day=' + d, { method: 'PUT', headers: {'Content-Type':'application/json'}, body: JSON.stringify(body) });
      toast('Updated', 'ok');
    }

    // Modal
    function openModal(dateStr) {
      document.getElementById('modal-heading').textContent = 'New Event';
      document.getElementById('f-id').value = '';
      document.getElementById('f-title').value = '';
      document.getElementById('f-date').value = dateStr || today();
      document.getElementById('f-start').value = '09:00';
      document.getElementById('f-end').value = '10:00';
      document.getElementById('f-desc').value = '';
      document.getElementById('f-loc').value = '';
      document.getElementById('f-link').value = '';
      document.getElementById('f-color').value = '#4A90D9';
      document.getElementById('f-block').checked = false;
      document.getElementById('modal').classList.add('open');
    }
    function editEvent(id) {
      const e = events.find(x => x.id === id);
      if (!e) return;
      document.getElementById('modal-heading').textContent = 'Edit Event';
      document.getElementById('f-id').value = e.id;
      document.getElementById('f-title').value = e.title;
      document.getElementById('f-date').value = e.start_time.split('T')[0];
      document.getElementById('f-start').value = e.start_time.split('T')[1].substring(0,5);
      document.getElementById('f-end').value = e.end_time.split('T')[1].substring(0,5);
      document.getElementById('f-desc').value = e.description || '';
      document.getElementById('f-loc').value = e.location || '';
      document.getElementById('f-link').value = e.meeting_link || '';
      document.getElementById('f-color').value = e.color || '#4A90D9';
      document.getElementById('f-block').checked = !!e.is_blocking;
      document.getElementById('modal').classList.add('open');
    }
    function closeModal() { document.getElementById('modal').classList.remove('open'); }
    async function saveEvent() {
      const id = document.getElementById('f-id').value;
      const date = document.getElementById('f-date').value;
      const data = {
        title: document.getElementById('f-title').value,
        description: document.getElementById('f-desc').value,
        start_time: date + 'T' + document.getElementById('f-start').value,
        end_time: date + 'T' + document.getElementById('f-end').value,
        location: document.getElementById('f-loc').value,
        meeting_link: document.getElementById('f-link').value,
        color: document.getElementById('f-color').value,
        is_blocking: document.getElementById('f-block').checked,
        status: 'confirmed'
      };
      if (!data.title) return toast('Title is required', 'err');
      if (id) {
        await fetch('/api/events?id=' + id, { method: 'PUT', headers: {'Content-Type':'application/json'}, body: JSON.stringify(data) });
        toast('Event updated', 'ok');
      } else {
        await fetch('/api/events', { method: 'POST', headers: {'Content-Type':'application/json'}, body: JSON.stringify(data) });
        toast('Event created', 'ok');
      }
      closeModal();
      await loadEvents(); renderMiniCal(); renderToday(); renderDayView();
    }

    // Helpers
    function today() { return new Date().toISOString().split('T')[0]; }
    function fmtTime(ts) {
      if (!ts) return '';
      const p = ts.split('T')[1].substring(0,5).split(':');
      const h = parseInt(p[0]), m = p[1];
      return (h > 12 ? h-12 : h || 12) + ':' + m + (h >= 12 ? ' PM' : ' AM');
    }
    function esc(s) { const d = document.createElement('div'); d.textContent = s || ''; return d.innerHTML; }
    function toast(msg, type) { const t = document.getElementById('toast'); t.textContent = msg; t.className = 'toast ' + type + ' show'; setTimeout(() => t.classList.remove('show'), 3000); }
    function copyLink() { navigator.clipboard.writeText(location.origin + '/book').then(() => toast('Booking link copied!', 'ok')); }

    // Close modal on background click
    document.getElementById('modal').addEventListener('click', e => { if (e.target === e.currentTarget) closeModal(); });
  </script>
</body>
</html>
