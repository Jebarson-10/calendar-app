<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Book an Appointment</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root { --bg: #0f1117; --surface: #1a1d27; --surface2: #242836; --border: #2e3348; --text: #e4e6f0; --text2: #8b8fa8; --accent: #6c5ce7; --accent2: #a29bfe; --green: #00b894; --red: #e17055; --blue: #74b9ff; }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: 'Inter', sans-serif; background: var(--bg); color: var(--text); min-height: 100vh; }
    .container { max-width: 900px; margin: 0 auto; padding: 40px 24px; }
    .hero { text-align: center; margin-bottom: 36px; }
    .hero h1 { font-size: 28px; font-weight: 700; margin-bottom: 8px; }
    .hero h1 em { color: var(--accent2); font-style: normal; }
    .hero p { color: var(--text2); font-size: 15px; }
    .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 28px; }
    @media (max-width: 700px) { .grid { grid-template-columns: 1fr; } }
    .card { background: var(--surface); border-radius: 16px; padding: 24px; border: 1px solid var(--border); }
    .card h2 { font-size: 16px; font-weight: 600; margin-bottom: 16px; }
    .cal-nav { display: flex; justify-content: space-between; align-items: center; margin-bottom: 14px; }
    .cal-nav button { background: none; border: none; color: var(--text2); cursor: pointer; font-size: 20px; padding: 4px 10px; border-radius: 6px; }
    .cal-nav button:hover { background: var(--surface2); color: var(--text); }
    .cal-grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 3px; text-align: center; }
    .cal-label { font-size: 10px; color: var(--text2); padding: 8px 0; font-weight: 600; text-transform: uppercase; }
    .cal-day { padding: 10px 0; font-size: 14px; border-radius: 8px; cursor: pointer; transition: .15s; color: var(--text2); }
    .cal-day:hover { background: var(--surface2); }
    .cal-day.today { color: var(--accent2); font-weight: 700; }
    .cal-day.selected { background: var(--accent); color: #fff; font-weight: 700; }
    .cal-day.other { opacity: .2; pointer-events: none; }
    .cal-day.past { opacity: .25; pointer-events: none; }
    .cal-day.open { color: var(--green); }
    .cal-day.open::after { content: ''; display: block; width: 5px; height: 5px; background: var(--green); border-radius: 50%; margin: 3px auto 0; }
    .slots { margin-top: 18px; }
    .slots h3 { font-size: 13px; font-weight: 600; color: var(--text2); margin-bottom: 10px; }
    .slot-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
    .slot { padding: 10px; text-align: center; background: var(--surface2); border: 1px solid var(--border); border-radius: 8px; cursor: pointer; font-size: 13px; font-weight: 500; transition: .2s; }
    .slot:hover { border-color: var(--accent); }
    .slot.active { background: var(--accent); border-color: var(--accent); color: #fff; }
    .field { margin-bottom: 16px; }
    .field label { display: block; font-size: 12px; font-weight: 600; color: var(--text2); margin-bottom: 6px; text-transform: uppercase; letter-spacing: .5px; }
    .field input, .field textarea { width: 100%; padding: 11px 14px; background: var(--surface2); border: 1px solid var(--border); border-radius: 8px; color: var(--text); font-size: 14px; font-family: inherit; }
    .field input:focus, .field textarea:focus { outline: none; border-color: var(--accent); }
    .field-row { display: flex; gap: 12px; }
    .field-row .field { flex: 1; }
    .sel-info { display: none; margin-bottom: 16px; padding: 12px; background: var(--surface2); border-radius: 8px; font-size: 13px; color: var(--accent2); font-weight: 500; }
    .btn-submit { width: 100%; padding: 14px; background: var(--accent); color: #fff; border: none; border-radius: 10px; font-size: 15px; font-weight: 700; cursor: pointer; font-family: inherit; transition: .2s; }
    .btn-submit:hover { opacity: .85; }
    .btn-submit:disabled { opacity: .4; cursor: not-allowed; }
    .done { display: none; text-align: center; padding: 60px 24px; }
    .done.show { display: block; }
    .done-icon { font-size: 56px; margin-bottom: 16px; }
    .done h2 { margin-bottom: 8px; font-size: 22px; }
    .done p { color: var(--text2); font-size: 15px; margin-bottom: 24px; }
    .toast { position: fixed; bottom: 24px; right: 24px; background: var(--surface); border: 1px solid var(--border); border-radius: 10px; padding: 14px 20px; font-size: 14px; z-index: 200; transform: translateY(100px); opacity: 0; transition: .3s; }
    .toast.show { transform: translateY(0); opacity: 1; }
    .toast.err { border-left: 3px solid var(--red); }
    .footer { text-align: center; margin-top: 36px; color: var(--text2); font-size: 12px; }
  </style>
</head>
<body>
  <div class="container">
    <div class="hero">
      <h1>Book an <em>Appointment</em></h1>
      <p>Select a date and time, then fill in your details to request a meeting.</p>
    </div>
    <div id="booking-form">
      <div class="grid">
        <div class="card">
          <h2>Select a Date</h2>
          <div id="picker"></div>
          <div class="slots" id="slots-box" style="display:none">
            <h3 id="slots-label">Available times</h3>
            <div class="slot-grid" id="slots"></div>
          </div>
        </div>
        <div class="card">
          <h2>Your Details</h2>
          <div class="sel-info" id="sel-info"></div>
          <div class="field"><label>Your Name *</label><input type="text" id="r-name" placeholder="John Doe"></div>
          <div class="field"><label>Email *</label><input type="email" id="r-email" placeholder="john@example.com"></div>
          <div class="field"><label>Meeting Title *</label><input type="text" id="r-title" placeholder="Project sync, Interview, etc."></div>
          <div class="field"><label>Description</label><textarea id="r-desc" rows="3" placeholder="What would you like to discuss?"></textarea></div>
          <div class="field"><label>Your Meeting Link</label><input type="url" id="r-link" placeholder="https://zoom.us/j/... or meet.google.com/..."></div>
          <div class="field-row">
            <div class="field"><label>Start Time *</label><input type="time" id="r-start" value="09:00"></div>
            <div class="field"><label>End Time *</label><input type="time" id="r-end" value="09:30"></div>
          </div>
          <button class="btn-submit" id="submit-btn" onclick="submitReq()">Request Appointment</button>
        </div>
      </div>
    </div>
    <div class="done" id="done">
      <div class="done-icon">&#127881;</div>
      <h2>Request Submitted!</h2>
      <p>Your appointment request has been sent. You will be notified once it is reviewed.</p>
      <button class="btn-submit" style="max-width:300px;margin:0 auto" onclick="resetForm()">Book Another</button>
    </div>
    <div class="footer">Powered by Calendar App</div>
  </div>
  <div class="toast" id="toast"></div>
  <script>
    let avail = [], selDate = null, selSlot = null;
    const DAYS = ['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];
    const MONTHS = ['January','February','March','April','May','June','July','August','September','October','November','December'];
    const cm = { y: new Date().getFullYear(), m: new Date().getMonth() };

    document.addEventListener('DOMContentLoaded', async () => { const r = await fetch('/api/book'); avail = await r.json(); renderPicker(); });

    function renderPicker() {
      const el = document.getElementById('picker');
      const { y, m } = cm;
      const first = new Date(y, m, 1), last = new Date(y, m+1, 0);
      const sd = first.getDay(), today = new Date(); today.setHours(0,0,0,0);
      const open = new Set(avail.filter(a => a.enabled).map(a => a.day_of_week));
      let h = '<div class="cal-nav"><button onclick="nav(-1)">&#8249;</button><span style="font-size:15px;font-weight:600">' + MONTHS[m] + ' ' + y + '</span><button onclick="nav(1)">&#8250;</button></div>';
      h += '<div class="cal-grid">';
      DAYS.forEach(d => h += '<div class="cal-label">' + d + '</div>');
      for (let i = 0; i < sd; i++) h += '<div class="cal-day other"></div>';
      for (let d = 1; d <= last.getDate(); d++) {
        const dt = new Date(y, m, d);
        const ds = y + '-' + String(m+1).padStart(2,'0') + '-' + String(d).padStart(2,'0');
        const past = dt < today, isToday = dt.getTime() === today.getTime(), isSel = selDate === ds;
        const isOpen = open.has(dt.getDay()) && !past;
        let cls = 'cal-day';
        if (past) cls += ' past'; if (isToday) cls += ' today'; if (isSel) cls += ' selected'; if (isOpen) cls += ' open';
        h += '<div class="' + cls + '" onclick="pick(\'' + ds + '\',' + dt.getDay() + ')">' + d + '</div>';
      }
      h += '</div>';
      el.innerHTML = h;
    }

    function nav(d) { cm.m += d; if (cm.m < 0) { cm.m = 11; cm.y--; } if (cm.m > 11) { cm.m = 0; cm.y++; } renderPicker(); }
    function pick(ds, dow) { selDate = ds; selSlot = null; renderPicker(); showSlots(ds, dow); }

    function showSlots(ds, dow) {
      const box = document.getElementById('slots-box'), el = document.getElementById('slots'), lbl = document.getElementById('slots-label');
      const a = avail.find(x => x.day_of_week === dow);
      if (!a || !a.enabled) { box.style.display = 'none'; return; }
      lbl.textContent = 'Available on ' + DAYS[dow];
      const sh = parseInt(a.start_hour), eh = parseInt(a.end_hour);
      let s = [];
      for (let h = sh; h < eh; h++) for (let m = 0; m < 60; m += 30) s.push(String(h).padStart(2,'0') + ':' + String(m).padStart(2,'0'));
      el.innerHTML = s.map(t => '<div class="slot' + (selSlot === t ? ' active' : '') + '" onclick="pickSlot(\'' + t + '\')">' + fmtSlot(t) + '</div>').join('');
      box.style.display = 'block';
    }

    function pickSlot(t) {
      selSlot = t;
      const dow = new Date(selDate).getDay();
      showSlots(selDate, dow);
      const [h, m] = t.split(':').map(Number);
      let eh = h, em = m + 30; if (em >= 60) { eh++; em -= 60; }
      document.getElementById('r-start').value = t;
      document.getElementById('r-end').value = String(eh).padStart(2,'0') + ':' + String(em).padStart(2,'0');
      const d = new Date(selDate);
      const info = document.getElementById('sel-info');
      info.textContent = DAYS[dow] + ', ' + MONTHS[d.getMonth()] + ' ' + d.getDate() + ' at ' + fmtSlot(t);
      info.style.display = 'block';
    }

    async function submitReq() {
      const name = document.getElementById('r-name').value.trim();
      const email = document.getElementById('r-email').value.trim();
      const title = document.getElementById('r-title').value.trim();
      const desc = document.getElementById('r-desc').value.trim();
      const link = document.getElementById('r-link').value.trim();
      const start = document.getElementById('r-start').value;
      const end = document.getElementById('r-end').value;
      if (!name || !email || !title || !selDate || !start || !end) return toast('Please fill all required fields and select a date', 'err');
      if (!email.includes('@')) return toast('Please enter a valid email', 'err');
      const btn = document.getElementById('submit-btn');
      btn.disabled = true; btn.textContent = 'Submitting...';
      try {
        const res = await fetch('/api/book', { method: 'POST', headers: {'Content-Type':'application/json'}, body: JSON.stringify({requester_name:name,requester_email=email,title,description:desc,requested_date:selDate,requested_start:start,requested_end:end,meeting_link:link}) });
        const data = await res.json();
        if (!res.ok) { toast(data.error || 'Error', 'err'); btn.disabled = false; btn.textContent = 'Request Appointment'; return; }
        document.getElementById('booking-form').style.display = 'none';
        document.getElementById('done').classList.add('show');
      } catch(e) { toast('Network error', 'err'); }
      btn.disabled = false; btn.textContent = 'Request Appointment';
    }

    function resetForm() {
      document.getElementById('booking-form').style.display = 'block';
      document.getElementById('done').classList.remove('show');
      selDate = null; selSlot = null;
      ['r-name','r-email','r-title','r-desc','r-link'].forEach(id => document.getElementById(id).value = '');
      document.getElementById('sel-info').style.display = 'none';
      document.getElementById('slots-box').style.display = 'none';
      renderPicker();
    }

    function fmtSlot(t) { const [h,m] = t.split(':').map(Number); return (h > 12 ? h-12 : h || 12) + ':' + String(m).padStart(2,'0') + (h >= 12 ? ' PM' : ' AM'); }
    function toast(msg, type) { const t = document.getElementById('toast'); t.textContent = msg; t.className = 'toast ' + type + ' show'; setTimeout(() => t.classList.remove('show'), 3000); }
  </script>
</body>
</html>
